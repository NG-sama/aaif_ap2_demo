[project]
name = "aaif-ap2-demo"
version = "0.1.0"
description = "Toy MCP payments server contrasting DPoP-style proof-of-possession with a static bearer key"
readme = "README.md"
authors = [
    { name = "NG-sama", email = "30478691+NG-sama@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44",
    "mcp>=2.1.1",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
dpop-demo = "aaif_ap2_demo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
